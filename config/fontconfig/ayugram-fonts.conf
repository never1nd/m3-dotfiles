<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Map Telegram's Open Sans -> Roboto Flex -->
  <match target="pattern">
    <test qual="any" name="family"><string>Open Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto Flex</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Open Sans Semibold</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto Flex</string></edit>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Step up weight cleanly inside AyuGram: unset/Regular(80) -> Medium(100), DemiBold(180) -> Bold(200) -->
  <match target="pattern">
    <test name="family"><string>Roboto Flex</string></test>
    <edit name="weight" mode="append"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto Flex</string></test>
    <test name="weight" compare="less_eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Roboto Flex</string></test>
    <test name="weight" compare="more_eq"><const>demibold</const></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>

  <!-- Crisp stem hinting & subpixel rendering for sharper text on dark surfaces -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
