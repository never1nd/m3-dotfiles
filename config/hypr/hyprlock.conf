source = ~/.config/hypr/m3-colors.conf

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = m3Expressive, 0.34, 1.35, 0.64, 1.0
    bezier = m3Effects, 0.2, 0.0, 0.0, 1.0
    animation = fadeIn, 1, 3, m3Effects
    animation = fadeOut, 1, 2, m3Effects
    animation = inputFieldDots, 1, 2, m3Expressive
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    contrast = 0.94
    brightness = 0.62
    vibrancy = 0.22
}

# M3 Expressive Editorial Display Large Emphasized Clock
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 104
    font_family = Roboto Flex Bold
    position = 0, 150
    halign = center
    valign = center
}

# Localized Date (Title Medium Emphasized)
label {
    monitor =
    text = cmd[update:60000] LC_TIME=ru_RU.UTF-8 date +"%A, %d %B" | sed 's/^./\U&/'
    color = $primary
    font_size = 20
    font_family = Roboto Flex Medium
    position = 0, 56
    halign = center
    valign = center
}

# M3 Expressive Tonal Pill Input Field (56px height, Full 28px rounding)
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    outer_color = $primary
    inner_color = $surface_container_high
    font_color = $on_surface
    fade_on_empty = false
    rounding = 28
    placeholder_text = <span foreground="##b8b0c0">Введите пароль...</span>
    check_color = $tertiary
    fail_color = $error
    fail_text = <i>Неверный пароль ($ATTEMPTS)</i>
    position = 0, -68
    halign = center
    valign = center
}
