# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Cursor & smooth trail
cursor_shape                beam
cursor_shape_unfocused      beam
inactive_text_alpha         1.0
shell_integration           no-cursor
cursor_beam_thickness       1.8
cursor_blink_interval       0.6
cursor_trail                1
cursor_trail_decay          0.1 0.3
cursor_trail_start_threshold 2

# Scrollback & mouse
scrollback_lines            10000
wheel_scroll_multiplier     3.0
enable_audio_bell           no
copy_on_select              no
strip_trailing_spaces       smart
detect_urls                 yes
open_url_with               default

# Window appearance (frosted glass + Wayland CSD titlebar)
remember_window_size        no
window_padding_width        12 14
background_opacity          0.90
hide_window_decorations     yes
wayland_titlebar_color      background
confirm_os_window_close     0

# Tabs (M3 Expressive rounded pill tabs)
tab_bar_edge                bottom
tab_bar_margin_width        10.0
tab_bar_margin_height       6.0 8.0
tab_bar_style               separator
tab_separator               "  "
tab_bar_min_tabs            2
tab_title_template          "  {index} · {title}  "

# Allow TUI apps (prime-agent) seamless OSC 52 clipboard access without prompts
clipboard_control           write-clipboard write-primary read-clipboard read-primary

# Keybindings: Ctrl+C / Ctrl+V on BOTH EN and RU layouts (Ctrl+Shift+C passes through to prime-agent copySelection!)
map ctrl+c                  copy_or_interrupt
map ctrl+с                  copy_or_interrupt
map ctrl+shift+с            send_key ctrl+shift+c
map ctrl+v                  paste_from_clipboard
map ctrl+м                  paste_from_clipboard
map ctrl+shift+v            paste_from_clipboard
map ctrl+shift+м            paste_from_clipboard

# Tabs & zoom
map ctrl+shift+t            new_tab_with_cwd
map ctrl+shift+w            close_tab
map ctrl+tab                next_tab
map ctrl+shift+tab          previous_tab
map ctrl+equal              change_font_size all +1.0
map ctrl+minus              change_font_size all -1.0
map ctrl+0                  change_font_size all 0

# Material Design 3 Expressive dynamic theme
include themes/m3-expressive.conf
